<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' https: data: blob:; connect-src 'self' https: http://127.0.0.1:* http://localhost:*; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Check a game · Cybersea</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icons/favicon-192.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body>
<div id="app">
  <main>
    <section class="card setup">
      <h2>Check a game’s spreadsheet</h2>
      <p class="note">After deploying the script (see SETUP.md), paste its web app URL and the GM passphrase. This checks that the site can reach it and that values come back unchanged.</p>
      <form id="diag" class="setup">
        <label class="field"><span class="lbl">Web app URL</span><input class="in" name="api" required placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off"></label>
        <label class="field"><span class="lbl">Passphrase</span><input class="in" name="key" type="password" required autocomplete="off" data-1p-ignore data-lpignore="true" data-bwignore data-form-type="other"></label>
        <div class="prow"><span class="grow"></span><button class="pbtn primary">Run checks</button></div>
      </form>
      <div id="out" class="diag"></div>
    </section>
  </main>
</div>
<script type="module" src="assets/diag.js"></script>
</body>
</html>
